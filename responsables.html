<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsables des départements - AJADD MANAGER</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    background: #f1f3f7;
    color: #17263b;
}

.container {
    max-width: 1100px;
    margin: auto;
}

header {
    background: #071b36;
    color: white;
    padding: 22px;
    border-bottom: 5px solid #d5aa42;
    border-radius: 10px;
    margin-bottom: 20px;
}

header h1 {
    margin: 0 0 8px;
}

header p {
    color: #f0d27b;
    margin: 0;
}

button {
    border: none;
    border-radius: 6px;
    padding: 12px 16px;
    cursor: pointer;
    font-weight: bold;
}

.back {
    background: #071b36;
    color: white;
    margin-bottom: 15px;
}

.panel {
    background: white;
    padding: 22px;
    border-radius: 10px;
    margin-bottom: 22px;
    box-shadow: 0 3px 12px #0000000d;
}

h2 {
    color: #071b36;
    border-bottom: 2px solid #d5aa42;
    padding-bottom: 12px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.form-group {
    margin-bottom: 8px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd2dc;
    border-radius: 6px;
    font-size: 15px;
}

textarea {
    min-height: 85px;
    resize: vertical;
}

.full {
    grid-column: 1 / -1;
}

.save {
    background: #071b36;
    color: white;
    margin-top: 15px;
}

.save:hover, .back:hover {
    background: #bd902c;
    color: #071b36;
}

.delete {
    background: #a52b35;
    color: white;
    padding: 8px 10px;
}

#message {
    margin-top: 15px;
    font-weight: bold;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 750px;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #071b36;
    color: white;
}

@media(max-width: 650px) {
    body {
        padding: 10px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<div class="container">

<button class="back" onclick="location.href='dashboard.html'">
← Retour au tableau de bord
</button>

<button class="back" onclick="location.href='departements.html'">
← Retour aux départements
</button>

<header>
    <h1>AJADD MANAGER</h1>
    <p>GESTION DES RESPONSABLES NATIONAUX</p>
</header>

<section class="panel">
    <h2>Nommer un responsable national</h2>

    <form id="responsableForm">

        <div class="form-grid">

            <div class="form-group">
                <label>Nom</label>
                <input type="text" id="nom" required>
            </div>

            <div class="form-group">
                <label>Prénoms</label>
                <input type="text" id="prenoms" required>
            </div>

            <div class="form-group">
                <label>Département</label>
                <select id="departement" required>
                    <option value="">Choisir un département</option>
                    <option>Services digitaux</option>
                    <option>Commerciaux et Entrepreneuriat</option>
                    <option>Événementiel et Culture</option>
                    <option>Formations et Éducation</option>
                    <option>Relations extérieures et Partenariats</option>
                    <option>Autre département</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fonction</label>
                <input type="text"
                       id="fonction"
                       value="Responsable national(e)"
                       required>
            </div>

            <div class="form-group">
                <label>Téléphone / WhatsApp</label>
                <input type="tel" id="telephone" required>
            </div>

            <div class="form-group">
                <label>Région</label>
                <select id="region" required>
                    <option value="">Choisir une région</option>
                    <option>Maritime</option>
                    <option>Plateaux</option>
                    <option>Centrale</option>
                    <option>Kara</option>
                    <option>Savanes</option>
                </select>
            </div>

            <div class="form-group">
                <label>Date de nomination</label>
                <input type="date" id="dateNomination" required>
            </div>

            <div class="form-group">
                <label>Statut</label>
                <select id="statut" required>
                    <option value="Actif">Actif</option>
                    <option value="En attente">En attente</option>
                    <option value="Suspendu">Suspendu</option>
                </select>
            </div>

            <div class="form-group full">
                <label>Observations et missions</label>
                <textarea id="observations"
                placeholder="Décrire les missions ou observations..."></textarea>
            </div>

        </div>

        <button type="submit" class="save">
            ENREGISTRER LE RESPONSABLE
        </button>

        <p id="message"></p>

    </form>
</section>

<section class="panel">
    <h2>Liste des responsables nationaux</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>N°</th>
                    <th>Nom et prénoms</th>
                    <th>Département</th>
                    <th>Téléphone</th>
                    <th>Région</th>
                    <th>Statut</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="responsableTable"></tbody>
        </table>
    </div>

    <p id="emptyList">Aucun responsable enregistré.</p>
</section>

</div>

<script>
const form = document.getElementById("responsableForm");
const message = document.getElementById("message");

function getResponsables() {
    return JSON.parse(
        localStorage.getItem("ajaddResponsables") || "[]"
    );
}

function afficherResponsables() {
    const responsables = getResponsables();
    const table = document.getElementById("responsableTable");
    const empty = document.getElementById("emptyList");

    table.innerHTML = "";
    empty.style.display = responsables.length ? "none" : "block";

    responsables.forEach((personne, index) => {
        const row = document.createElement("tr");

        const valeurs = [
            index + 1,
            personne.nom + " " + personne.prenoms,
            personne.departement,
            personne.telephone,
            personne.region,
            personne.statut
        ];

        valeurs.forEach(valeur => {
            const cell = document.createElement("td");
            cell.textContent = valeur;
            row.appendChild(cell);
        });

        const action = document.createElement("td");
        const bouton = document.createElement("button");

        bouton.textContent = "Supprimer";
        bouton.className = "delete";

        bouton.addEventListener("click", function() {
            supprimerResponsable(index);
        });

        action.appendChild(bouton);
        row.appendChild(action);
        table.appendChild(row);
    });
}

function supprimerResponsable(index) {
    if (!confirm("Voulez-vous vraiment supprimer ce responsable ?")) {
        return;
    }

    const responsables = getResponsables();
    responsables.splice(index, 1);

    localStorage.setItem(
        "ajaddResponsables",
        JSON.stringify(responsables)
    );

    afficherResponsables();
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const responsables = getResponsables();
    const departement = document.getElementById("departement").value;

    const existe = responsables.some(personne =>
        personne.departement === departement
    );

    if (existe) {
        message.style.color = "red";
        message.textContent =
            "Un responsable est déjà enregistré pour ce département.";
        return;
    }

    const responsable = {
        nom: document.getElementById("nom").value.trim(),
        prenoms: document.getElementById("prenoms").value.trim(),
        departement: departement,
        fonction: document.getElementById("fonction").value.trim(),
        telephone: document.getElementById("telephone").value.trim(),
        region: document.getElementById("region").value,
        dateNomination: document.getElementById("dateNomination").value,
        statut: document.getElementById("statut").value,
        observations: document.getElementById("observations").value.trim()
    };

    responsables.push(responsable);

    localStorage.setItem(
        "ajaddResponsables",
        JSON.stringify(responsables)
    );

    message.style.color = "green";
    message.textContent = "Responsable enregistré avec succès.";

    form.reset();
    document.getElementById("fonction").value =
        "Responsable national(e)";

    afficherResponsables();
});

afficherResponsables();
</script>

<script src="protection.js"></script>
</body>
</html>
