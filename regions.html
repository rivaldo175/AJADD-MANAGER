<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bureaux régionaux - AJADD MANAGER</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    background: #f1f3f7;
    color: #17263b;
}

.container {
    max-width: 1150px;
    margin: auto;
}

header {
    background: #071b36;
    color: white;
    padding: 22px;
    border-bottom: 5px solid #d5aa42;
    border-radius: 10px;
    margin: 20px 0;
}

header h1 {
    margin: 0 0 8px;
}

header p {
    color: #f0d27b;
}

.panel {
    background: white;
    padding: 22px;
    border-radius: 10px;
    margin-bottom: 22px;
    box-shadow: 0 3px 12px #0000000d;
}

h2 {
    color: #071b36;
    border-bottom: 2px solid #d5aa42;
    padding-bottom: 12px;
    margin-bottom: 20px;
}

button {
    padding: 11px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.back {
    background: #071b36;
    color: white;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.form-group {
    margin-bottom: 10px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd2dc;
    border-radius: 6px;
    background: white;
    font-size: 15px;
}

.full {
    grid-column: 1 / -1;
}

.save {
    background: #071b36;
    color: white;
    margin-top: 15px;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #071b36;
    color: white;
}

.delete {
    background: #a52b35;
    color: white;
}

.edit {
    background: #d5aa42;
    color: #071b36;
    margin-right: 5px;
}

#message {
    margin-top: 15px;
    font-weight: bold;
}

@media(max-width:650px) {
    body {
        padding: 10px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<div class="container">

<button class="back" onclick="location.href='dashboard.html'">
← Retour au tableau de bord
</button>

<header>
    <h1>AJADD MANAGER</h1>
    <p>GESTION DES BUREAUX RÉGIONAUX</p>
</header>

<section class="panel">

<h2>Créer un bureau régional</h2>

<form id="regionForm">

<div class="form-grid">

    <div class="form-group">
        <label>Région</label>
        <select id="region" required>
            <option value="">Choisir une région</option>
            <option>Maritime</option>
            <option>Plateaux</option>
            <option>Centrale</option>
            <option>Kara</option>
            <option>Savanes</option>
        </select>
    </div>

    <div class="form-group">
        <label>Ville du siège régional</label>
        <input type="text" id="siege" required>
    </div>

    <div class="form-group">
        <label>Directeur(trice) régional(e)</label>
        <input type="text" id="directeur" required>
    </div>

    <div class="form-group">
        <label>Secrétaire régional(e)</label>
        <input type="text" id="secretaire" required>
    </div>

    <div class="form-group">
        <label>Secrétaire régional(e) adjoint(e)</label>
        <input type="text" id="secretaireAdjoint">
    </div>

    <div class="form-group">
        <label>Trésorier(ère) régional(e)</label>
        <input type="text" id="tresorier" required>
    </div>

    <div class="form-group">
        <label>Trésorier(ère) régional(e) adjoint(e)</label>
        <input type="text" id="tresorierAdjoint">
    </div>

    <div class="form-group">
        <label>Premier(ère) conseiller(ère)</label>
        <input type="text" id="premierConseiller" required>
    </div>

    <div class="form-group">
        <label>Deuxième conseiller(ère)</label>
        <input type="text" id="deuxiemeConseiller" required>
    </div>

    <div class="form-group">
        <label>Téléphone du bureau régional</label>
        <input type="tel" id="telephone">
    </div>

    <div class="form-group">
        <label>Statut du bureau</label>
        <select id="statut">
            <option value="En attente">En attente</option>
            <option value="Actif">Actif</option>
            <option value="Suspendu">Suspendu</option>
        </select>
    </div>

</div>

<button type="submit" class="save">
ENREGISTRER LE BUREAU RÉGIONAL
</button>

<p id="message"></p>

</form>
</section>

<section class="panel">

<h2>Liste des cinq bureaux régionaux</h2>

<div class="table-container">
<table>
<thead>
<tr>
<th>N°</th>
<th>Région</th>
<th>Siège</th>
<th>Directeur régional</th>
<th>Statut</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="regionTable"></tbody>
</table>
</div>

<p id="emptyList">Aucun bureau régional enregistré.</p>

</section>

</div>

<script>

const form = document.getElementById("regionForm");

const regionFields = [
    "region",
    "siege",
    "directeur",
    "secretaire",
    "secretaireAdjoint",
    "tresorier",
    "tresorierAdjoint",
    "premierConseiller",
    "deuxiemeConseiller",
    "telephone",
    "statut"
];

function getRegions() {
    return JSON.parse(
        localStorage.getItem("ajaddRegions") || "[]"
    );
}

function afficherRegions() {

    const regions = getRegions();

    const table = document.getElementById("regionTable");
    const empty = document.getElementById("emptyList");

    table.innerHTML = "";

    empty.style.display =
        regions.length ? "none" : "block";

    regions.forEach((region, index) => {

        const row = document.createElement("tr");

        [
            index + 1,
            region.region,
            region.siege,
            region.directeur,
            region.statut
        ].forEach(value => {

            const cell = document.createElement("td");
            cell.textContent = value || "Non renseigné";
            row.appendChild(cell);

        });

        const action = document.createElement("td");

        const edit = document.createElement("button");
        edit.textContent = "Modifier";
        edit.className = "edit";

        edit.onclick = () => modifierRegion(index);

        const del = document.createElement("button");
        del.textContent = "Supprimer";
        del.className = "delete";

        del.onclick = () => supprimerRegion(index);

        action.appendChild(edit);
        action.appendChild(del);

        row.appendChild(action);
        table.appendChild(row);

    });
}

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const regions = getRegions();

    const regionName =
        document.getElementById("region").value;

    const existe = regions.some(r =>
        r.region === regionName
    );

    if (existe) {
        document.getElementById("message").style.color = "red";
        document.getElementById("message").textContent =
            "Cette région possède déjà un bureau enregistré.";
        return;
    }

    const bureau = {};

    regionFields.forEach(field => {
        bureau[field] =
            document.getElementById(field).value.trim();
    });

    regions.push(bureau);

    localStorage.setItem(
        "ajaddRegions",
        JSON.stringify(regions)
    );

    document.getElementById("message").style.color = "green";
    document.getElementById("message").textContent =
        "Bureau régional enregistré avec succès.";

    form.reset();

    afficherRegions();

});

function modifierRegion(index) {

    const regions = getRegions();
    const bureau = regions[index];

    for (const field of regionFields) {

        const nouvelleValeur = prompt(
            "Modifier : " + field,
            bureau[field] || ""
        );

        if (nouvelleValeur === null) return;

        bureau[field] = nouvelleValeur.trim();

    }

    const doublon = regions.some((r, i) =>
        i !== index && r.region === bureau.region
    );

    if (doublon) {
        alert("Cette région possède déjà un bureau.");
        return;
    }

    regions[index] = bureau;

    localStorage.setItem(
        "ajaddRegions",
        JSON.stringify(regions)
    );

    afficherRegions();

    alert("Bureau régional modifié avec succès.");

}

function supprimerRegion(index) {

    if (!confirm("Voulez-vous supprimer ce bureau régional ?")) {
        return;
    }

    const regions = getRegions();

    regions.splice(index, 1);

    localStorage.setItem(
        "ajaddRegions",
        JSON.stringify(regions)
    );

    afficherRegions();

}

afficherRegions();

</script>

<script src="protection.js"></script>
</body>
</html>
