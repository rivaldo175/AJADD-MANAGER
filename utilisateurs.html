<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des utilisateurs | AJADD MANAGER</title>

<script src="protection.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f3f7;
    color: #222;
}

header {
    background: #172554;
    color: white;
    padding: 20px;
}

header h2 {
    margin-bottom: 6px;
}

.retour {
    display: inline-block;
    color: white;
    margin-top: 12px;
    text-decoration: none;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    margin-bottom: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}

h3 {
    color: #172554;
    margin-bottom: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.field {
    margin-bottom: 14px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

.permissions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 10px;
}

.permissions label {
    font-weight: normal;
    display: flex;
    align-items: center;
    gap: 8px;
}

.permissions input {
    width: auto;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
}

.btn-primary {
    background: #172554;
    color: white;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

.btn-success {
    background: #15803d;
    color: white;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #172554;
    color: white;
}

.table-container {
    overflow-x: auto;
}

.status-actif {
    color: #15803d;
    font-weight: bold;
}

.status-suspendu {
    color: #dc2626;
    font-weight: bold;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}

.note {
    color: #666;
    font-size: 13px;
    margin-top: 7px;
}

@media(max-width: 650px) {
    .form-grid, .permissions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h2>AJADD MANAGER</h2>
    <p>Gestion des utilisateurs</p>
    <a class="retour" href="dashboard.html">← Retour au tableau de bord</a>
</header>

<div class="container">

<div class="card">
    <h3>Créer un profil utilisateur</h3>

    <form id="formUtilisateur">

        <div class="form-grid">

            <div class="field">
                <label>Nom complet</label>
                <input type="text" id="nom" required>
            </div>

            <div class="field">
                <label>Identifiant</label>
                <input type="text" id="identifiant" required>
            </div>

            <div class="field">
                <label>Adresse e-mail</label>
                <input type="email" id="email" required>
            </div>

            <div class="field">
                <label>Fonction</label>
                <input type="text" id="fonction" required>
            </div>

            <div class="field">
                <label>Rôle</label>
                <select id="role" required>
                    <option value="">Choisir un rôle</option>
                    <option value="dg">Directeur Général</option>
                    <option value="responsable">Responsable</option>
                    <option value="membre">Membre</option>
                    <option value="agent">Agent</option>
                </select>
            </div>

            <div class="field">
                <label>Statut</label>
                <select id="statut">
                    <option value="actif">Actif</option>
                    <option value="suspendu">Suspendu</option>
                </select>
            </div>

            <div class="field">
                <label>Mot de passe provisoire</label>
                <input
                    type="password"
                    id="motDePasse"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
                <p class="note">Minimum 8 caractères.</p>
            </div>

            <div class="field">
                <label>Confirmer le mot de passe</label>
                <input
                    type="password"
                    id="confirmation"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

        </div>

        <h3>Autorisations d'accès</h3>

        <div class="permissions">
            <label><input type="checkbox" value="direction"> Direction générale</label>
            <label><input type="checkbox" value="bureau"> Bureau exécutif</label>
            <label><input type="checkbox" value="departements"> Départements</label>
            <label><input type="checkbox" value="responsables"> Responsables</label>
            <label><input type="checkbox" value="membres"> Membres</label>
            <label><input type="checkbox" value="regions"> Régions</label>
            <label><input type="checkbox" value="responsablesregionaux"> Responsables régionaux</label>
            <label><input type="checkbox" value="evenements"> Événements</label>
            <label><input type="checkbox" value="projetsevenementiels"> Projets événementiels</label>
            <label><input type="checkbox" value="budgetevenements"> Budgets événements</label>
            <label><input type="checkbox" value="formations"> Formations</label>
            <label><input type="checkbox" value="commerces"> Commerces</label>
            <label><input type="checkbox" value="partenaires"> Partenaires</label>
            <label><input type="checkbox" value="finance"> Finances</label>
            <label><input type="checkbox" value="documents"> Documents</label>
            <label><input type="checkbox" value="communication"> Communications</label>
        </div>

        <button type="submit" class="btn-primary">
            Enregistrer le profil
        </button>

        <p id="message" class="message"></p>

    </form>
</div>

<div class="card">
    <h3>Liste des utilisateurs</h3>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Identifiant</th>
                    <th>Fonction</th>
                    <th>Rôle</th>
                    <th>Statut</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="listeUtilisateurs"></tbody>
        </table>
    </div>
</div>

</div>

<script>
(function () {
    "use strict";

    let session;

    try {
        session = JSON.parse(
            sessionStorage.getItem("ajaddSession") || "null"
        );
    } catch (e) {
        session = null;
    }

    if (!session || String(session.role).toLowerCase() !== "pdg") {
        alert("Accès réservé au PDG.");
        window.location.replace("dashboard.html");
        return;
    }

    const form = document.getElementById("formUtilisateur");
    const liste = document.getElementById("listeUtilisateurs");
    const message = document.getElementById("message");

    function obtenirUtilisateurs() {
        try {
            return JSON.parse(
                localStorage.getItem("ajaddUtilisateurs") || "[]"
            );
        } catch (e) {
            return [];
        }
    }

    function sauvegarderUtilisateurs(utilisateurs) {
        localStorage.setItem(
            "ajaddUtilisateurs",
            JSON.stringify(utilisateurs)
        );
    }

    function afficherUtilisateurs() {
        const utilisateurs = obtenirUtilisateurs();
        liste.innerHTML = "";

        const visibles = utilisateurs.filter(u =>
            !["pdg", "administrateur_principal"].includes(
                String(u.role || "").toLowerCase()
            )
        );

        if (visibles.length === 0) {
            liste.innerHTML = `
                <tr>
                    <td colspan="6">Aucun profil enregistré.</td>
                </tr>
            `;
            return;
        }

        visibles.forEach(utilisateur => {
            const ligne = document.createElement("tr");

            const valeurs = [
                utilisateur.nom || utilisateur.nom_complet || "",
                utilisateur.identifiant || "",
                utilisateur.fonction || "",
                utilisateur.role || "",
                utilisateur.statut || "actif"
            ];

            valeurs.forEach((valeur, position) => {
                const cellule = document.createElement("td");
                cellule.textContent = valeur;

                if (position === 4) {
                    cellule.className =
                        valeur === "actif"
                            ? "status-actif"
                            : "status-suspendu";
                }

                ligne.appendChild(cellule);
            });

            const action = document.createElement("td");
            const bouton = document.createElement("button");

            bouton.textContent =
                utilisateur.statut === "suspendu"
                    ? "Activer"
                    : "Suspendre";

            bouton.className =
                utilisateur.statut === "suspendu"
                    ? "btn-success"
                    : "btn-danger";

            bouton.addEventListener("click", function () {
                changerStatut(utilisateur.id);
            });

            action.appendChild(bouton);
            ligne.appendChild(action);
            liste.appendChild(ligne);
        });
    }

    function changerStatut(id) {
        const utilisateurs = obtenirUtilisateurs();
        const utilisateur = utilisateurs.find(u => u.id === id);

        if (!utilisateur) return;

        utilisateur.statut =
            utilisateur.statut === "suspendu"
                ? "actif"
                : "suspendu";

        sauvegarderUtilisateurs(utilisateurs);
        afficherUtilisateurs();
    }

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const nom = document.getElementById("nom").value.trim();
        const identifiant = document.getElementById("identifiant").value.trim();
        const email = document.getElementById("email").value.trim();
        const fonction = document.getElementById("fonction").value.trim();
        const role = document.getElementById("role").value;
        const statut = document.getElementById("statut").value;

        const motDePasse = document.getElementById("motDePasse").value;
        const confirmation = document.getElementById("confirmation").value;

        if (motDePasse.length < 8) {
            message.textContent =
                "Le mot de passe doit comporter au moins 8 caractères.";
            message.style.color = "red";
            return;
        }

        if (motDePasse !== confirmation) {
            message.textContent =
                "Les deux mots de passe ne sont pas identiques.";
            message.style.color = "red";
            return;
        }

        const permissions = Array.from(
            document.querySelectorAll(".permissions input:checked")
        ).map(element => element.value);

        const utilisateurs = obtenirUtilisateurs();

        const existe = utilisateurs.some(u =>
            String(u.identifiant || "").toLowerCase() === identifiant.toLowerCase() ||
            String(u.email || "").toLowerCase() === email.toLowerCase()
        );

        if (existe) {
            message.textContent =
                "Cet identifiant ou cet e-mail existe déjà.";
            message.style.color = "red";
            return;
        }

        const nouvelUtilisateur = {
            id: "AJADD-" + Date.now(),
            nom: nom,
            identifiant: identifiant,
            email: email,
            fonction: fonction,
            role: role,
            statut: statut,
            permissions: permissions,
            date_creation: new Date().toISOString()
        };

        utilisateurs.push(nouvelUtilisateur);
        sauvegarderUtilisateurs(utilisateurs);

        // Effacer immédiatement les champs sensibles.
        document.getElementById("motDePasse").value = "";
        document.getElementById("confirmation").value = "";

        form.reset();

        message.textContent =
            "Profil enregistré localement. Le compte de connexion Appwrite reste à créer.";
        message.style.color = "#b45309";

        afficherUtilisateurs();
    });

    afficherUtilisateurs();

})();
</script>

</body>
</html>
