<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des utilisateurs | AJADD MANAGER</title>

<script src="protection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@29.3.1"></script>
<script src="appwrite.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f3f7;
    color: #222;
}

header {
    background: #172554;
    color: white;
    padding: 20px;
}

header h2 {
    margin-bottom: 6px;
}

.retour {
    display: inline-block;
    color: white;
    margin-top: 12px;
    text-decoration: none;
}

.container {
    max-width: 1100px;
    margin: 25px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    margin-bottom: 22px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}

h3 {
    color: #172554;
    margin-bottom: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.field {
    margin-bottom: 14px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

.permissions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 10px;
}

.permissions label {
    font-weight: normal;
    display: flex;
    align-items: center;
    gap: 8px;
}

.permissions input {
    width: auto;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.btn-primary {
    background: #172554;
    color: white;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #172554;
    color: white;
}

.table-container {
    overflow-x: auto;
}

.status-actif {
    color: #15803d;
    font-weight: bold;
}

.status-suspendu {
    color: #dc2626;
    font-weight: bold;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}

.note {
    color: #666;
    font-size: 13px;
    margin-top: 7px;
}

@media(max-width: 650px) {
    .form-grid, .permissions {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h2>AJADD MANAGER</h2>
    <p>Gestion des utilisateurs</p>
    <a class="retour" href="dashboard.html">
        ← Retour au tableau de bord
    </a>
</header>

<div class="container">

    <div class="card">
        <h3>Créer un profil utilisateur</h3>

        <form id="formUtilisateur">

            <div class="form-grid">

                <div class="field">
                    <label for="nom">Nom complet</label>
                    <input type="text" id="nom" required>
                </div>

                <div class="field">
                    <label for="identifiant">Identifiant</label>
                    <input type="text" id="identifiant" required>
                </div>

                <div class="field">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="field">
                    <label for="fonction">Fonction</label>
                    <input type="text" id="fonction" required>
                </div>

                <div class="field">
                    <label for="role">Rôle</label>
                    <select id="role" required>
                        <option value="">Choisir un rôle</option>
                        <option value="dg">Directeur Général</option>
                        <option value="responsable">Responsable</option>
                        <option value="membre">Membre</option>
                        <option value="agent">Agent</option>
                    </select>
                </div>

                <div class="field">
                    <label for="statut">Statut</label>
                    <select id="statut">
                        <option value="actif">Actif</option>
                        <option value="suspendu">Suspendu</option>
                    </select>
                </div>

                <div class="field">
                    <label for="motDePasse">Mot de passe provisoire</label>
                    <input
                        type="password"
                        id="motDePasse"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                    <p class="note">Minimum 8 caractères.</p>
                </div>

                <div class="field">
                    <label for="confirmation">
                        Confirmer le mot de passe
                    </label>
                    <input
                        type="password"
                        id="confirmation"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

            </div>

            <h3>Autorisations d'accès</h3>

            <div class="permissions">

                <label><input type="checkbox" value="direction"> Direction générale</label>

                <label><input type="checkbox" value="bureau"> Bureau exécutif</label>

                <label><input type="checkbox" value="departements"> Départements</label>

                <label><input type="checkbox" value="responsables"> Responsables</label>

                <label><input type="checkbox" value="membres"> Membres</label>

                <label><input type="checkbox" value="regions"> Régions</label>

                <label><input type="checkbox" value="responsablesregionaux"> Responsables régionaux</label>

                <label><input type="checkbox" value="evenements"> Événements</label>

                <label><input type="checkbox" value="projetsevenementiels"> Projets événementiels</label>

                <label><input type="checkbox" value="budgetsevenements"> Budgets événements</label>

                <label><input type="checkbox" value="formations"> Formations</label>

                <label><input type="checkbox" value="commerces"> Commerces</label>

                <label><input type="checkbox" value="partenaires"> Partenaires</label>

                <label><input type="checkbox" value="finance"> Finances</label>

                <label><input type="checkbox" value="budgets"> Budgets</label>

                <label><input type="checkbox" value="documents"> Documents</label>

                <label><input type="checkbox" value="communications"> Communications</label>

            </div>

            <button type="submit" class="btn-primary">
                Enregistrer le profil
            </button>

            <p id="message" class="message"></p>

        </form>
    </div>

    <div class="card">

        <h3>Liste des utilisateurs</h3>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Identifiant</th>
                        <th>Fonction</th>
                        <th>Rôle</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="listeUtilisateurs">
                    <tr>
                        <td colspan="6">Chargement...</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

</div>

<script>
(function () {
    "use strict";

    let session;

    try {
        session = JSON.parse(
            sessionStorage.getItem("ajaddSession") || "null"
        );
    } catch (e) {
        session = null;
    }

    if (!session || String(session.role).toLowerCase() !== "pdg") {
        alert("Accès réservé au PDG.");
        window.location.replace("dashboard.html");
        return;
    }

    const form = document.getElementById("formUtilisateur");
    const liste = document.getElementById("listeUtilisateurs");
    const message = document.getElementById("message");

    const DATABASE_ID = window.AJADD_DATABASE_ID;
    const TABLE_ID = window.AJADD_TABLES.profils_utilisateurs;
    const FUNCTION_ID = "ajadd-create-user";

    if (
        typeof Appwrite === "undefined" ||
        !window.ajaddAppwriteClient ||
        !window.ajaddTablesDB ||
        !DATABASE_ID ||
        !TABLE_ID
    ) {
        alert("Erreur de connexion à Appwrite. Vérifiez appwrite.js.");
        return;
    }

    const functions = new Appwrite.Functions(
        window.ajaddAppwriteClient
    );

    const tables = window.ajaddTablesDB;

    function afficherMessage(texte, couleur) {
        message.textContent = texte;
        message.style.color = couleur;
    }

    async function afficherUtilisateurs() {

        liste.innerHTML = `
            <tr>
                <td colspan="6">Chargement des utilisateurs...</td>
            </tr>
        `;

        try {

            const resultat = await tables.listRows({
                databaseId: DATABASE_ID,
                tableId: TABLE_ID
            });

            liste.innerHTML = "";

            const utilisateurs = resultat.rows.filter(u =>
                String(u.role || "").toLowerCase() !== "pdg"
            );

            if (utilisateurs.length === 0) {
                liste.innerHTML = `
                    <tr>
                        <td colspan="6">Aucun utilisateur enregistré.</td>
                    </tr>
                `;
                return;
            }

            utilisateurs.forEach(u => {

                const ligne = document.createElement("tr");

                const valeurs = [
                    u.nom_complet || "",
                    u.identifiant || "",
                    u.fonction || "",
                    u.role || "",
                    u.statut || ""
                ];

                valeurs.forEach((valeur, i) => {

                    const cellule = document.createElement("td");
                    cellule.textContent = valeur;

                    if (i === 4) {
                        cellule.className =
                            valeur === "actif"
                                ? "status-actif"
                                : "status-suspendu";
                    }

                    ligne.appendChild(cellule);
                });

                const action = document.createElement("td");
                action.textContent = "À configurer";

                ligne.appendChild(action);
                liste.appendChild(ligne);

            });

        } catch (erreur) {

            console.error("Erreur de chargement :", erreur);

            liste.innerHTML = `
                <tr>
                    <td colspan="6">
                        Impossible de charger les utilisateurs.
                        Vérifiez les permissions Appwrite.
                    </td>
                </tr>
            `;
        }
    }

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const nom = document.getElementById("nom").value.trim();
        const identifiant = document.getElementById("identifiant").value.trim();
        const email = document.getElementById("email").value.trim();
        const fonction = document.getElementById("fonction").value.trim();
        const role = document.getElementById("role").value;
        const statut = document.getElementById("statut").value;

        const motDePasse = document.getElementById("motDePasse").value;
        const confirmation = document.getElementById("confirmation").value;

        if (motDePasse.length < 8) {
            afficherMessage(
                "Le mot de passe doit comporter au moins 8 caractères.",
                "red"
            );
            return;
        }

        if (motDePasse !== confirmation) {
            afficherMessage(
                "Les deux mots de passe ne sont pas identiques.",
                "red"
            );
            return;
        }

        const permissions = Array.from(
            document.querySelectorAll(".permissions input:checked")
        ).map(element => element.value);

        const bouton = form.querySelector('button[type="submit"]');

        bouton.disabled = true;
        bouton.textContent = "Création en cours...";

        try {

            const execution = await functions.createExecution({
                functionId: FUNCTION_ID,
                body: JSON.stringify({
                    nom_complet: nom,
                    identifiant: identifiant,
                    email: email,
                    fonction: fonction,
                    role: role,
                    statut: statut,
                    password: motDePasse,
                    permissions: permissions
                }),
                async: false,
                path: "/",
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            });

            let resultat;

            try {
                resultat = JSON.parse(execution.responseBody || "{}");
            } catch (e) {
                throw new Error("Réponse Appwrite illisible.");
            }

            const codeHTTP = Number(execution.responseStatusCode);

            if (
                codeHTTP < 200 ||
                codeHTTP >= 300 ||
                !resultat.success
            ) {
                throw new Error(
                    resultat.message ||
                    "La création du compte a échoué."
                );
            }

            form.reset();

            afficherMessage(
                "Compte créé avec succès ! L'utilisateur peut maintenant se connecter.",
                "#15803d"
            );

            await afficherUtilisateurs();

        } catch (erreur) {

            console.error("Erreur Appwrite :", erreur);

            afficherMessage(
                erreur.message ||
                "Une erreur est survenue pendant la création.",
                "red"
            );

        } finally {

            document.getElementById("motDePasse").value = "";
            document.getElementById("confirmation").value = "";

            bouton.disabled = false;
            bouton.textContent = "Enregistrer le profil";

        }

    });

    afficherUtilisateurs();

})();
</script>

</body>
</html>
